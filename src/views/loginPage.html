
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Subscription Manager</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  ${themeResources}  <style>
    .login-container {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    .login-box {
      backdrop-filter: blur(8px);
      background-color: rgba(255, 255, 255, 0.9);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }
    .input-field {
      transition: all 0.3s;
      border: 1px solid #e2e8f0;
    }
    .input-field:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.25);
    }
    html.dark .login-container {
      background: linear-gradient(135deg, #3b4cc4 0%, #4a2b6b 100%);
    }
    html.dark .login-box {
      background-color: rgba(17, 24, 39, 0.95);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    html.dark .login-box .text-gray-800 { color: #f3f4f6; }
    html.dark .login-box .text-gray-600,
    html.dark .login-box .text-gray-700 { color: #cbd5e1; }
    .locale-switcher {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.25rem;
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 9999px;
      background-color: rgba(255, 255, 255, 0.7);
    }
    .locale-switcher-option {
      border: 0;
      background: transparent;
      border-radius: 9999px;
      padding: 0.35rem 0.75rem;
      font-size: 0.875rem;
      font-weight: 600;
      color: #4b5563;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .locale-switcher-option:hover {
      background-color: rgba(99, 102, 241, 0.12);
      color: #4338ca;
    }
    .locale-switcher-option.is-active {
      background-color: #4f46e5;
      color: #ffffff;
    }
    html.dark .locale-switcher {
      background-color: rgba(17, 24, 39, 0.6);
      border-color: rgba(148, 163, 184, 0.25);
    }
    html.dark .locale-switcher-option {
      color: #cbd5e1;
    }
    html.dark .locale-switcher-option:hover {
      background-color: rgba(129, 140, 248, 0.2);
      color: #e0e7ff;
    }
    html.dark .locale-switcher-option.is-active {
      background-color: #818cf8;
      color: #111827;
    }
  </style>
</head>
<body class="login-container flex items-center justify-center">
  <div class="login-box p-8 rounded-xl w-full max-w-md">
    <div class="flex justify-end mb-4">
      <div class="flex items-center gap-2 text-sm">
        <span class="text-gray-500 font-medium" data-i18n="login_language_label">Language</span>
        <div id="loginLocaleSwitcher" class="locale-switcher">
          <button type="button" class="locale-switcher-option" data-ui-locale-option="zh" aria-pressed="false">中文</button>
          <button type="button" class="locale-switcher-option" data-ui-locale-option="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </div>
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-gray-800"><i class="fas fa-calendar-check mr-2"></i><span data-i18n="login_heading">订阅管理系统</span></h1>
      <p class="text-gray-600 mt-2" data-i18n="login_subtitle">登录管理您的订阅提醒</p>
    </div>
    
    <form id="loginForm" class="space-y-6">
      <div>
        <label for="username" class="block text-sm font-medium text-gray-700 mb-1">
          <i class="fas fa-user mr-2"></i><span data-i18n="login_label_username">用户名</span>
        </label>
        <input type="text" id="username" name="username" required
          class="input-field w-full px-4 py-3 rounded-lg text-gray-700 focus:outline-none">
      </div>
      
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
          <i class="fas fa-lock mr-2"></i><span data-i18n="login_label_password">密码</span>
        </label>
        <input type="password" id="password" name="password" required
          class="input-field w-full px-4 py-3 rounded-lg text-gray-700 focus:outline-none">
      </div>
      
      <button type="submit" 
        class="btn-primary w-full py-3 rounded-lg text-white font-medium focus:outline-none">
        <i class="fas fa-sign-in-alt mr-2"></i><span data-i18n="login_submit">登录</span>
      </button>
      
      <div id="errorMsg" class="text-red-500 text-center"></div>
    </form>
  </div>
  
  <script>
    const loginForm = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const localeButtons = Array.from(document.querySelectorAll('[data-ui-locale-option]'));

    function setIdleSubmitLabel(button, locale = window.AppLocale.getPreferredLocale()) {
      button.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i>' + window.AppLocale.getMessage('login_submit', locale);
      button.disabled = false;
    }

    function syncLocaleButtons(locale = window.AppLocale.getPreferredLocale()) {
      localeButtons.forEach((button) => {
        const isActive = button.getAttribute('data-ui-locale-option') === locale;
        button.classList.toggle('is-active', isActive);
        button.setAttribute('aria-pressed', isActive ? 'true' : 'false');
      });
    }

    function applyLoginLocale(locale = window.AppLocale.getPreferredLocale()) {
      window.AppLocale.applyDocumentMetadata({ titleKey: 'page_title_login' }, document, locale);
      window.AppLocale.applyTranslations(document, locale);
      syncLocaleButtons(locale);

      const submitButton = loginForm.querySelector('button');
      if (submitButton && !submitButton.disabled) {
        setIdleSubmitLabel(submitButton, locale);
      }

      if (errorMsg.dataset.errorKey) {
        errorMsg.textContent = window.AppLocale.getMessage(errorMsg.dataset.errorKey, locale);
      }
    }

    localeButtons.forEach((button) => {
      button.addEventListener('click', () => {
        const locale = button.getAttribute('data-ui-locale-option');
        window.AppLocale.setStoredLocale(locale);
        applyLoginLocale(window.AppLocale.getPreferredLocale());
      });
    });

    applyLoginLocale();

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const preferredLocale = window.AppLocale.getPreferredLocale();
      
      const button = e.target.querySelector('button');
      errorMsg.dataset.errorKey = '';
      errorMsg.textContent = '';
      button.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>' + window.AppLocale.getMessage('login_submitting', preferredLocale);
      button.disabled = true;
      
      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            ...window.AppLocale.getRequestHeaders(preferredLocale)
          },
          body: JSON.stringify({ username, password })
        });
        
        const result = await response.json();
        
        if (result.success) {
          window.location.href = '/admin';
          return;
        }

        errorMsg.dataset.errorKey = 'login_error_invalid_credentials';
        errorMsg.textContent = window.AppLocale.getMessage(errorMsg.dataset.errorKey, preferredLocale);
        setIdleSubmitLabel(button, preferredLocale);
      } catch (error) {
        errorMsg.dataset.errorKey = 'login_error_generic';
        errorMsg.textContent = window.AppLocale.getMessage(errorMsg.dataset.errorKey, preferredLocale);
        setIdleSubmitLabel(button, preferredLocale);
      }
    });
  </script>
</body>
</html>
