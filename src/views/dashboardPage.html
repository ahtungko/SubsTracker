<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - SubsTracker</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  ${themeResources}  <style>
    .stat-card{background:white;border-radius:12px;padding:1.5rem;box-shadow:0 2px 8px rgba(0,0,0,0.1);transition:transform 0.2s,box-shadow 0.2s}
    .stat-card:hover{transform:translateY(-4px);box-shadow:0 4px 16px rgba(0,0,0,0.15)}
    .stat-card-header{color:#6b7280;font-size:0.875rem;font-weight:500;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:0.5rem}
    .stat-card-value{font-size:2rem;font-weight:700;color:#1f2937;margin-bottom:0.25rem}
    .stat-card-subtitle{color:#9ca3af;font-size:0.875rem}
    .stat-card-trend{display:inline-flex;align-items:center;gap:0.25rem;font-size:0.875rem;margin-top:0.5rem;padding:0.25rem 0.5rem;border-radius:6px}
    .stat-card-trend.up{color:#10b981;background:#d1fae5}
    .stat-card-trend.down{color:#ef4444;background:#fee2e2}
    .stat-card-trend.flat{color:#6b7280;background:#f3f4f6}
    .list-item{display:flex;align-items:center;justify-content:space-between;padding:1rem;border-radius:8px;transition:background 0.2s}
    .list-item:hover{background:#f9fafb}
    .list-item:not(:last-child){border-bottom:1px solid #f3f4f6}
    .list-item-content{flex:1}
    .list-item-name{font-weight:600;color:#1f2937;margin-bottom:0.25rem}
    .list-item-meta{display:flex;align-items:center;gap:1rem;font-size:0.875rem;color:#6b7280;flex-wrap:wrap}
    .list-item-amount{font-size:1.125rem;font-weight:700;color:#10b981}
    .list-item-badge{display:inline-block;padding:0.25rem 0.75rem;border-radius:12px;font-size:0.75rem;font-weight:500;background:#e0e7ff;color:#4f46e5}
    .ranking-item{margin-bottom:1rem}
    .ranking-item-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem}
    .ranking-item-name{font-weight:600;color:#1f2937}
    .ranking-item-value{display:flex;align-items:center;gap:0.5rem;font-size:0.875rem}
    .ranking-item-amount{font-weight:700;color:#1f2937}
    .ranking-item-percentage{color:#10b981}
    .ranking-progress{width:100%;height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden}
    .ranking-progress-bar{height:100%;border-radius:4px;transition:width 0.6s ease}
    .ranking-progress-bar.color-1{background:linear-gradient(90deg,#6366f1,#8b5cf6)}
    .ranking-progress-bar.color-2{background:linear-gradient(90deg,#10b981,#059669)}
    .ranking-progress-bar.color-3{background:linear-gradient(90deg,#f59e0b,#d97706)}
    .ranking-progress-bar.color-4{background:linear-gradient(90deg,#ef4444,#dc2626)}
    .ranking-progress-bar.color-5{background:linear-gradient(90deg,#8b5cf6,#7c3aed)}
    .empty-state{text-align:center;padding:3rem 1rem;color:#9ca3af}
    .empty-state-icon{font-size:3rem;margin-bottom:1rem;opacity:0.5}
    .empty-state-text{font-size:0.875rem}
    /* === Dashboard 暗黑模式修复 === */
    html.dark .stat-card {
      background: #1f2937; /* 深色卡片背景 */
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
    }
    html.dark .stat-card-header { color: #9ca3af; }
    html.dark .stat-card-value { color: #f3f4f6; } /* 白色文字 */
    html.dark .stat-card-subtitle { color: #6b7280; } 
    html.dark .stat-card-trend.flat { background: #374151; color: #9ca3af; }
    html.dark .stat-card-trend.up { background: rgba(16, 185, 129, 0.2); }
    html.dark .stat-card-trend.down { background: rgba(239, 68, 68, 0.2); }
    html.dark .list-item:hover { background: #374151; }
    html.dark .list-item:not(:last-child) { border-bottom-color: #374151; }
    html.dark .list-item-name { color: #f3f4f6; } /* 列表项名称变白 */
    html.dark .list-item-meta { color: #9ca3af; }
    html.dark .list-item-badge { background: #3730a3; color: #c7d2fe; }
    html.dark .ranking-item-name { color: #f3f4f6; } /* 排行榜名称变白 */
    html.dark .ranking-item-amount { color: #e5e7eb; } /* 金额变白 */
    html.dark .ranking-progress { background: #374151; }
    /* 修复右上角的标签 */
    html.dark .bg-indigo-100 { background-color: rgba(99, 102, 241, 0.2) !important; color: #a5b4fc !important; }
    html.dark .text-indigo-800 { color: #c7d2fe !important; }
    .loading-skeleton{background:linear-gradient(90deg,#f3f4f6 25%,#e5e7eb 50%,#f3f4f6 75%);background-size:200% 100%;animation:loading 1.5s infinite;height:100px;border-radius:8px}
    /* 暗黑模式骨架屏 */
    html.dark .loading-skeleton { background: linear-gradient(90deg, #374151 25%, #4b5563 50%, #374151 75%); }
    @keyframes loading{0%{background-position:200% 0}100%{background-position:-200% 0}}
  </style>
</head>

  <script>
    window.AppLocale.applyDocumentMetadata({ titleKey: 'page_title_dashboard' });
    window.AppLocale.applyTranslations();
    const getPreferredLocale = () => window.AppLocale.getPreferredLocale();
    const getLocaleTag = () => window.AppLocale.getUiLocaleTag(getPreferredLocale());
    const msg = (key, params = {}) => window.AppLocale.getMessage(key, getPreferredLocale(), params);
    const localizeSchedulerReason = (reason, reasonKey, reasonParams = {}) => {
      if (reasonKey) {
        return msg(reasonKey, reasonParams || {});
      }

      if (!reason) {
        return msg('dashboard_scheduler_no_details');
      }

      if (reason === '本次未命中需要提醒的订阅') {
        return msg('dashboard_scheduler_reason_no_matches');
      }

      const currentHourMatch = reason.match(/^当前小时 (.+) 未在通知时段内 \((.*)\)$/);
      if (currentHourMatch) {
        return msg('dashboard_scheduler_reason_current_hour_skipped', {
          hour: currentHourMatch[1],
          hours: currentHourMatch[2]
        });
      }

      const dedupeMatch = reason.match(/^命中 (\d+) 条，但全部在去重窗口内（跳过 (\d+) 条）$/);
      if (dedupeMatch) {
        return msg('dashboard_scheduler_reason_dedupe_only', {
          matched: dedupeMatch[1],
          skipped: dedupeMatch[2]
        });
      }

      const sendSummaryMatch = reason.match(/^已尝试发送到 (\d+) 个渠道，成功 (\d+) 个（去重跳过 (\d+) 条）$/);
      if (sendSummaryMatch) {
        return msg('dashboard_scheduler_reason_send_summary', {
          attempted: sendSummaryMatch[1],
          success: sendSummaryMatch[2],
          skipped: sendSummaryMatch[3]
        });
      }

      if (reason === '未启用任何通知渠道') {
        return msg('dashboard_scheduler_reason_no_channels');
      }

      const executionErrorMatch = reason.match(/^执行异常: (.*)$/);
      if (executionErrorMatch) {
        return msg('dashboard_scheduler_reason_execution_error', {
          error: executionErrorMatch[1]
        });
      }

      return reason;
    };

    // 定义货币符号映射
    const currencySymbols = {
      'MYR': 'RM', 'CNY': '¥', 'USD': '$', 'HKD': 'HK$', 'TWD': 'NT$', 
      'JPY': '¥', 'EUR': '€', 'GBP': '£', 'KRW': '₩', 'TRY': '₺', 'KGS': 'сом'
    };
    function getSymbol(currency) {
      return currencySymbols[currency] || 'RM';
    }

    // 前端统一本地时区显示
    async function showSystemTime() {
      try {
        const localTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';

        function update() {
          const now = new Date();
          const timeStr = now.toLocaleString(getLocaleTag(), {
            timeZone: localTimezone,
            year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit', second: '2-digit'
          });
          const tzStr = window.AppLocale.formatTimezoneDisplay(localTimezone);
          const el = document.getElementById('systemTimeDisplay');
          if (el) {
            el.textContent = `${timeStr}  ${tzStr}`;
          }
          const mobileEl = document.getElementById('mobileTimeDisplay');
          if (mobileEl) {
            mobileEl.textContent = `${timeStr} ${tzStr}`;
          }
        }

        update();
        setInterval(update, 1000);
      } catch (e) {
        console.error(e);
      }
    }

    async function loadDashboardData(){
      try {
        const r=await fetch('/api/dashboard/stats',{headers:{...window.AppLocale.getRequestHeaders(getPreferredLocale())}});
        const d=await r.json();
        if(!d.success) throw new Error(d.message||msg('dashboard_load_failed'));
        
        const data=d.data;

        const schedulerStatusEl = document.getElementById('schedulerStatus');
        if (schedulerStatusEl) {
          const status = data.schedulerStatus;
          if (!status) {
            schedulerStatusEl.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🕐</div><div class="empty-state-text">' + msg('dashboard_scheduler_empty') + '</div></div>';
          } else {
            const sendResult = status.sendResult || {};
            const statusReason = localizeSchedulerReason(status.reason, status.reasonKey, status.reasonParams);
            const unknownTime = msg('dashboard_scheduler_history_unknown_time');
            const runAt = status.lastRunAt ? new Date(status.lastRunAt).toLocaleString(getLocaleTag()) : unknownTime;
            const configuredHours = Array.isArray(status.configuredHours) && status.configuredHours.length > 0
              ? status.configuredHours.join(', ')
              : msg('dashboard_scheduler_current_hour_all');
            const sentBadgeText = status.sent
              ? msg('dashboard_scheduler_sent_badge')
              : msg('dashboard_scheduler_not_sent_badge');
            const sentBadgeClass = status.sent
              ? 'bg-green-100 text-green-700'
              : 'bg-yellow-100 text-yellow-700';
            const sentBadge = `<span class="px-2 py-1 rounded text-xs font-medium ${sentBadgeClass}">${sentBadgeText}</span>`;

            schedulerStatusEl.innerHTML = `
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                <div class="bg-gray-50 rounded-md p-3">
                  <div class="text-gray-500">${msg('dashboard_scheduler_last_run_label')}</div>
                  <div class="text-gray-900 font-medium mt-1">${runAt}</div>
                </div>
                <div class="bg-gray-50 rounded-md p-3">
                  <div class="text-gray-500">${msg('dashboard_scheduler_status_label')}</div>
                  <div class="mt-1">${sentBadge}</div>
                </div>
                <div class="bg-gray-50 rounded-md p-3">
                  <div class="text-gray-500">${msg('dashboard_scheduler_current_hour_label')}</div>
                  <div class="text-gray-900 font-medium mt-1">${status.currentHour ?? '--'} / ${configuredHours}</div>
                </div>
                <div class="bg-gray-50 rounded-md p-3">
                  <div class="text-gray-500">${msg('dashboard_scheduler_checked_matches_label')}</div>
                  <div class="text-gray-900 font-medium mt-1">${msg('dashboard_scheduler_checked_matches', { checked: status.checkedSubscriptions || 0, matched: status.expiringMatched || 0 })}</div>
                </div>
                <div class="bg-gray-50 rounded-md p-3 md:col-span-2">
                  <div class="text-gray-500">${msg('dashboard_scheduler_send_result_label')}</div>
                  <div class="text-gray-900 font-medium mt-1">${msg('dashboard_scheduler_send_result', { attempted: sendResult.attempted || 0, success: sendResult.successCount || 0, failed: sendResult.failedCount || 0, skipped: status.dedupeSkipped || 0 })}</div>
                  <div class="text-xs text-gray-500 mt-1">${statusReason || msg('dashboard_scheduler_no_details')}</div>
                </div>
              </div>
            `;
          }
        }

        const schedulerHistory = Array.isArray(data.schedulerStatusHistory) ? data.schedulerStatusHistory : [];
        const schedulerHistoryEl = document.getElementById('schedulerStatusHistory');
        if (schedulerHistoryEl) {
          if (schedulerHistory.length === 0) {
            schedulerHistoryEl.innerHTML = '<div class="text-sm text-gray-500">' + msg('dashboard_scheduler_history_empty') + '</div>';
          } else {
            schedulerHistoryEl.innerHTML = schedulerHistory.slice(0, 10).map(item => {
              const when = item.lastRunAt ? new Date(item.lastRunAt).toLocaleString(getLocaleTag()) : msg('dashboard_scheduler_history_unknown_time');
              const sent = item.sent
                ? msg('dashboard_scheduler_history_sent')
                : msg('dashboard_scheduler_history_not_sent');
              const reason = localizeSchedulerReason(item.reason, item.reasonKey, item.reasonParams);
              return `<div class="py-2 border-b border-gray-100 last:border-b-0 text-sm"><div class="font-medium text-gray-800">${when} · ${sent}</div><div class="text-xs text-gray-500 mt-1">${reason}</div></div>`;
            }).join('');
          }
        }

        document.getElementById('statsGrid').innerHTML=`
          <div class="stat-card">
            <div class="stat-card-header">${msg('dashboard_stats_monthly_spend')}</div>
            <div class="stat-card-value">RM${data.monthlyExpense.amount.toFixed(2)}</div>
            <div class="stat-card-subtitle">${msg('dashboard_stats_monthly_subtitle')}</div>
            <div class="stat-card-trend ${data.monthlyExpense.trendDirection}">
              <i class="fas fa-arrow-${data.monthlyExpense.trendDirection==='up'?'up':data.monthlyExpense.trendDirection==='down'?'down':'right'}"></i>
              ${data.monthlyExpense.trend}%
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-card-header">${msg('dashboard_stats_yearly_spend')}</div>
            <div class="stat-card-value">RM${data.yearlyExpense.amount.toFixed(2)}</div>
            <div class="stat-card-subtitle">${msg('dashboard_stats_monthly_average', { amount: data.yearlyExpense.monthlyAverage.toFixed(2) })}</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-header">${msg('dashboard_stats_active_subscriptions')}</div>
            <div class="stat-card-value">${data.activeSubscriptions.active}</div>
            <div class="stat-card-subtitle">${msg('dashboard_stats_total_subscriptions', { count: data.activeSubscriptions.total })}</div>
            ${data.activeSubscriptions.expiringSoon>0?`<div class="stat-card-trend down"><i class="fas fa-exclamation-circle"></i>${msg('dashboard_stats_expiring_soon', { count: data.activeSubscriptions.expiringSoon })}</div>`:''}
          </div>
        `;
        
        const rp=document.getElementById('recentPayments');
        rp.innerHTML=data.recentPayments.length===0?'<div class="empty-state"><div class="empty-state-icon">📭</div><div class="empty-state-text">' + msg('dashboard_recent_payments_empty') + '</div></div>':
        data.recentPayments.map(s=>`
          <div class="list-item">
            <div class="list-item-content">
              <div class="list-item-name">${s.name}</div>
              <div class="list-item-meta">
                <span><i class="fas fa-calendar"></i> ${new Date(s.paymentDate).toLocaleDateString(getLocaleTag())}</span>
                ${s.customType?`<span class="list-item-badge">${s.customType}</span>`:''}
              </div>
            </div>
            <div class="list-item-amount">${getSymbol(s.currency)}${(s.amount||0).toFixed(2)}</div>
          </div>
        `).join('');
        
        const ur=document.getElementById('upcomingRenewals');
        ur.innerHTML=data.upcomingRenewals.length===0?'<div class="empty-state"><div class="empty-state-icon">?</div><div class="empty-state-text">' + msg('dashboard_upcoming_empty') + '</div></div>':
        data.upcomingRenewals.map(s=>`
          <div class="list-item">
            <div class="list-item-content">
              <div class="list-item-name">${s.name}</div>
              <div class="list-item-meta">
                <span><i class="fas fa-clock"></i> ${new Date(s.renewalDate).toLocaleDateString(getLocaleTag())}</span>
                <span style="color:#f59e0b;font-weight:600">${msg('dashboard_upcoming_days_left', { count: s.daysUntilRenewal })}</span>
                ${s.customType?`<span class="list-item-badge">${s.customType}</span>`:''}
              </div>
            </div>
            <div class="list-item-amount">${getSymbol(s.currency)}${(s.amount||0).toFixed(2)}</div>
          </div>
        `).join('');
        
        const et=document.getElementById('expenseByType');
        et.innerHTML=data.expenseByType.length===0?'<div class="empty-state"><div class="empty-state-icon">📊</div><div class="empty-state-text">' + msg('dashboard_spending_empty') + '</div></div>':
        data.expenseByType.map((item,i)=>`
          <div class="ranking-item">
            <div class="ranking-item-header">
              <div class="ranking-item-name">${item.type}</div>
              <div class="ranking-item-value">
                <span class="ranking-item-amount">RM${item.amount.toFixed(2)}</span>
                <span class="ranking-item-percentage">${item.percentage}%</span>
              </div>
            </div>
            <div class="ranking-progress">
              <div class="ranking-progress-bar color-${(i%5)+1}" style="width:${item.percentage}%"></div>
            </div>
          </div>
        `).join('');
        
        const ec=document.getElementById('expenseByCategory');
        ec.innerHTML=data.expenseByCategory.length===0?'<div class="empty-state"><div class="empty-state-icon">📂</div><div class="empty-state-text">' + msg('dashboard_spending_empty') + '</div></div>':
        data.expenseByCategory.map((item,i)=>`
          <div class="ranking-item">
            <div class="ranking-item-header">
              <div class="ranking-item-name">${item.category}</div>
              <div class="ranking-item-value">
                <span class="ranking-item-amount">RM${item.amount.toFixed(2)}</span>
                <span class="ranking-item-percentage">${item.percentage}%</span>
              </div>
            </div>
            <div class="ranking-progress">
              <div class="ranking-progress-bar color-${(i%5)+1}" style="width:${item.percentage}%"></div>
            </div>
          </div>
        `).join('');
      } catch(e){
        console.error('加载仪表盘数据失败:',e);
        document.getElementById('statsGrid').innerHTML='<div class="empty-state"><div class="empty-state-icon">?</div><div class="empty-state-text">'+msg('dashboard_load_failed_prefix')+e.message+'</div></div>';
      }
    }
    
    // 初始化时间显示和数据加载
    showSystemTime();
    loadDashboardData();
    setInterval(loadDashboardData, 60000);

    // --- 移动端菜单控制脚本 ---
    const mobileMenuBtn = document.getElementById('mobile-menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    
    if (mobileMenuBtn && mobileMenu) {
      const syncMobileMenuState = () => {
        const icon = mobileMenuBtn.querySelector('i');
        const isHidden = mobileMenu.classList.contains('hidden');
        mobileMenuBtn.setAttribute('aria-expanded', isHidden ? 'false' : 'true');
        if (icon) {
          icon.classList.toggle('fa-bars', isHidden);
          icon.classList.toggle('fa-times', !isHidden);
        }
      };

      mobileMenuBtn.addEventListener('click', () => {
        mobileMenu.classList.toggle('hidden');
        syncMobileMenuState();
      });

      mobileMenu.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', () => {
          mobileMenu.classList.add('hidden');
          syncMobileMenuState();
        });
      });

      document.addEventListener('click', (event) => {
        if (mobileMenu.classList.contains('hidden')) return;
        if (!mobileMenu.contains(event.target) && !mobileMenuBtn.contains(event.target)) {
          mobileMenu.classList.add('hidden');
          syncMobileMenuState();
        }
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !mobileMenu.classList.contains('hidden')) {
          mobileMenu.classList.add('hidden');
          syncMobileMenuState();
        }
      });

      syncMobileMenuState();
    }
  </script>
</body>
</html>
